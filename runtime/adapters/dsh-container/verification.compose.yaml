name: ai-agent-harness-dsh-verification

services:
  home-init:
    image: ${DSH_IMAGE_TAG:?镜像标签由 source.lock.json 解析结果注入}
    pull_policy: never
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    environment:
      - HOME=/var/lib/dsh
      - DSH_HOME=/var/lib/dsh
      - DSH_HARNESS_MODE=verification
      - DSH_RUNTIME_UID=${DSH_RUNTIME_UID:-1000}
      - DSH_RUNTIME_GID=${DSH_RUNTIME_GID:-1000}
    entrypoint: [node, /opt/dsh-adapter/prepare-verification-home.mjs]
    volumes:
      - type: bind
        source: ${DSH_ADAPTER_HOST:?适配层脚本目录由启动器注入}
        target: /opt/dsh-adapter
        read_only: true
      - type: bind
        source: ./verification-home-controls
        target: /opt/dsh-verification-controls
        read_only: true
      - type: bind
        source: ${DSH_WEB_PROFILE_MANIFEST_HOST:?Web Profile 由所选来源注入}
        target: /opt/dsh-verification-controls/web-profile.package.json
        read_only: true
      - type: bind
        source: ${DSH_WEB_PROFILE_SEED_DIR_HOST:?Web Profile 来源目录由所选来源注入}
        target: /opt/dsh-profile-seed
        read_only: true
      - type: volume
        source: dsh-verification-home
        target: /var/lib/dsh
      - type: volume
        source: dsh-verification-trusted-fallback
        target: /var/lib/dsh/profiles/node_modules

  dsh:
    image: ${DSH_IMAGE_TAG:?镜像标签由 source.lock.json 解析结果注入}
    pull_policy: never
    restart: unless-stopped
    init: true
    entrypoint: [node, --expose-internals, /opt/dsh/apps/cli/lib/bin.js]
    depends_on:
      home-init:
        condition: service_completed_successfully
    user: "${DSH_RUNTIME_UID:-1000}:${DSH_RUNTIME_GID:-1000}"
    working_dir: /work/harness/workspace
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    stop_grace_period: 20s
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=64m,mode=1777
    environment:
      - HOME=/var/lib/dsh
      - DSH_HOME=/var/lib/dsh
      - DSH_HARNESS_MODE=verification
      - DSH_PERMISSION_MODE=read-only
      - DSH_TELEMETRY_DISABLED=1
      - DSH_EVAL_TARGET_PRESET=${DSH_EVAL_TARGET_PRESET:?业务 Preset 由所选来源注入}
    command:
      - --profile
      - web
      - --patch
      - ${DSH_MANAGED_PATCH:?Profile patch 路径由所选来源注入}
      - --patch
      - ${DSH_EVALUATION_PATCH:?评测 Patch 路径由所选来源注入}
      - --patch
      - /opt/dsh-adapter/verification-home-controls/web-base-path.patch.yml
      - --no-open
    volumes:
      - type: bind
        source: ${DSH_ADAPTER_HOST:?适配层脚本目录由启动器注入}
        target: /opt/dsh-adapter
        read_only: true
      - type: bind
        source: ${DSH_WEB_ADAPTER_HOST:?Web 基址适配器目录由启动器注入}
        target: /opt/dsh-web
        read_only: true
      - type: bind
        source: ${DSH_WORKSPACE_HOST:?工作区根由所选来源注入}
        target: /work/harness/workspace
        read_only: true
      - type: bind
        source: ${DSH_PRESETS_HOST:?preset 根由所选来源注入}
        target: /opt/dsh-presets
        read_only: true
      - type: bind
        source: ${DSH_MANAGED_HOST:?managed 根由所选来源注入}
        target: /opt/dsh-managed
        read_only: true
      - type: volume
        source: dsh-verification-trusted-fallback
        target: /opt/node_modules
        read_only: true
      - type: volume
        source: dsh-verification-home
        target: /var/lib/dsh
      - type: volume
        source: dsh-verification-trusted-fallback
        target: /var/lib/dsh/profiles/node_modules
        read_only: true
      - type: bind
        source: ./verification-home-controls/module-deny
        target: /var/lib/dsh/node_modules
        read_only: true
      - type: bind
        source: ./verification-home-controls/module-deny
        target: /var/lib/dsh/profiles/web/node_modules
        read_only: true
      - type: bind
        source: ./verification-home-controls/locked-user.patch.yml
        target: /var/lib/dsh/cordis.patch.yml
        read_only: true
      - type: bind
        source: ${DSH_WEB_PROFILE_MANIFEST_HOST:?Web Profile 由所选来源注入}
        target: /var/lib/dsh/profiles/web/package.json
        read_only: true
      - type: bind
        source: ./verification-home-controls/locked-global.AGENTS.md
        target: /var/lib/dsh/AGENTS.md
        read_only: true
      - type: bind
        source: ./verification-home-controls/locked-bootstrap.env
        target: /var/lib/dsh/.env
        read_only: true
      - type: bind
        source: ./verification-home-controls/locked-bootstrap.env
        target: /work/harness/workspace/.env
        read_only: true

volumes:
  dsh-verification-home:
  dsh-verification-trusted-fallback:
